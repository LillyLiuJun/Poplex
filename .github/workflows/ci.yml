name: Pull request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR jobs need only the repository contents. In particular, this workflow never
# receives production Supabase, Gemini, or App Store credentials.
permissions:
  contents: read

# New commits on the same PR supersede an older run, saving macOS runner minutes.
concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS tests
    # The app uses the iOS 26 Liquid Glass APIs, which require Xcode 26+.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # test-ios.sh owns the local default. The artifact path below references
      # the same variable so the two cannot drift. The `runner` context is not
      # available in job-level env, so use /tmp (always present on macOS
      # runners) instead of runner.temp.
      DERIVED_DATA_PATH: /tmp/AIEnglishApp-DerivedData
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect iOS source changes
        id: ios-changes
        if: github.event_name == 'pull_request'
        run: |
          # macOS runner minutes are billed at a premium, so PRs that touch only
          # backend/docs skip the iOS build. The job still reports success, so
          # a required "iOS tests" check keeps the same merge semantics.
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --quiet FETCH_HEAD HEAD -- \
              'AIEnglishApp/**' 'AIEnglishApp.xcodeproj/**' \
              'AIEnglishAppTests/**' 'AIEnglishAppUITests/**' \
              'scripts/ci/test-ios.sh' '.github/workflows/**'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip iOS tests (no iOS sources changed)
        if: github.event_name == 'pull_request' && steps.ios-changes.outputs.changed != 'true'
        run: echo "No iOS-relevant files changed; skipping the macOS build."
      - name: Restore Swift Package dependencies
        if: github.event_name == 'workflow_dispatch' || steps.ios-changes.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/AIEnglishApp-SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('AIEnglishApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Run the complete iOS test scheme
        if: github.event_name == 'workflow_dispatch' || steps.ios-changes.outputs.changed == 'true'
        env:
          IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
          CLONED_SOURCE_PACKAGES_DIR_PATH: ${{ runner.temp }}/AIEnglishApp-SourcePackages
        run: bash scripts/ci/test-ios.sh
      - name: Upload Xcode test results on failure
        if: ${{ (failure() || cancelled()) && (github.event_name == 'workflow_dispatch' || steps.ios-changes.outputs.changed == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: ${{ env.DERIVED_DATA_PATH }}/Logs/Test/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  edge-function-tests:
    name: Edge Function tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
          cache: true
      - name: Run all Edge Function tests
        run: bash scripts/ci/test-edge-functions.sh

  database-tests:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.107.0
      - name: Replay migrations and run database tests
        run: bash scripts/ci/test-database.sh
