<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Screen 2 - Asymmetric Layout</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:wght@600&family=Inter:wght@400;500;600&display=swap');

    :root {
        --page-bg: #FBF6F1;
        --text-primary: #1F1A17;
        --text-secondary: #7A7570;
        --text-muted: #9E9995;
        --brand-strong: #FF7622;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: #E5E5E5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Inter', sans-serif;
    }

    .device {
        width: 390px;
        height: 844px;
        background-color: var(--page-bg);
        border-radius: 40px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .status-bar {
        height: 44px;
    }

    .content {
        flex: 1;
        padding: 0 24px;
        display: flex;
        flex-direction: column;
    }

    .header {
        margin-top: 36px;
        display: flex;
        flex-direction: column;
        gap: 8px; /* paddingS */
    }

    .title {
        font-family: 'Newsreader', serif;
        font-size: 32px;
        line-height: 1.1;
        font-weight: 600;
        color: var(--text-primary);
    }

    .subtitle {
        font-family: 'Inter', sans-serif;
        font-size: 17px;
        line-height: 1.4;
        color: var(--text-secondary);
    }

    .modes-container {
        margin-top: 48px;
        display: flex;
        flex-direction: column;
        gap: 56px; /* Huge spacing for zig-zag */
    }

    .mode-row {
        position: relative;
        display: flex;
        flex-direction: column;
    }

    .mode-row.left {
        align-items: flex-start;
        padding-right: 40px;
    }

    .mode-row.right {
        align-items: flex-end;
        padding-left: 40px;
        text-align: right;
    }

    .watermark {
        position: absolute;
        top: -28px;
        width: 100px;
        height: 100px;
        color: var(--text-secondary);
        opacity: 0.06;
        z-index: 1;
    }

    .mode-row.left .watermark {
        left: -20px;
    }

    .mode-row.right .watermark {
        right: -20px;
    }

    .mode-text {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .mode-title {
        font-size: 17px;
        font-weight: 600;
        color: var(--text-primary);
    }

    .mode-detail {
        font-size: 17px;
        color: var(--text-secondary);
        line-height: 1.4;
    }

    .bottom-bar {
        position: absolute;
        bottom: 34px;
        left: 24px;
        right: 24px;
    }

    .continue-btn {
        width: 100%;
        height: 56px;
        background-color: var(--text-primary);
        color: #FFFFFF;
        border-radius: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 17px;
        font-weight: 600;
    }

</style>
</head>
<body>
    <div class="device">
        <div class="status-bar"></div>
        <div class="content">
            
            <div class="header">
                <div class="title">Share your context, in any format.</div>
                <div class="subtitle">Drop a photo, speak, or type. AI does the rest.</div>
            </div>

            <div class="modes-container">
                
                <!-- Camera Mode (Left aligned) -->
                <div class="mode-row left">
                    <svg class="watermark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <div class="mode-text">
                        <div class="mode-title">Snap a photo</div>
                        <div class="mode-detail">Your surroundings become the lesson.</div>
                    </div>
                </div>

                <!-- Mic Mode (Right aligned) -->
                <div class="mode-row right">
                    <svg class="watermark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <div class="mode-text">
                        <div class="mode-title">Say what's on your mind</div>
                        <div class="mode-detail">Your thoughts, captured in English.</div>
                    </div>
                </div>

                <!-- Keyboard Mode (Left aligned) -->
                <div class="mode-row left">
                    <svg class="watermark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                        <line x1="6" y1="8" x2="6.01" y2="8"></line>
                        <line x1="10" y1="8" x2="10.01" y2="8"></line>
                        <line x1="14" y1="8" x2="14.01" y2="8"></line>
                        <line x1="18" y1="8" x2="18.01" y2="8"></line>
                        <line x1="6" y1="12" x2="6.01" y2="12"></line>
                        <line x1="10" y1="12" x2="10.01" y2="12"></line>
                        <line x1="14" y1="12" x2="14.01" y2="12"></line>
                        <line x1="18" y1="12" x2="18.01" y2="12"></line>
                        <line x1="7" y1="16" x2="17" y2="16"></line>
                    </svg>
                    <div class="mode-text">
                        <div class="mode-title">Type a few words</div>
                        <div class="mode-detail">Even a fragment is enough.</div>
                    </div>
                </div>

            </div>
        </div>

        <div class="bottom-bar">
            <div class="continue-btn">Continue</div>
        </div>
    </div>
</body>
</html>
